name: Windows Release Build

on:
  push:
    branches:
      - master # master 브랜치에 푸시할 때 빌드가 시작됩니다.

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Qt 6.10.x 환경 설치 및 MinGW 설정
    - name: Install Qt Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        install-deps: 'true'

    # 2. CMake 기반 빌드 수행 (최상위 CMakeLists.txt 활용)
    - name: Configure and Build Project (CMake)
      run: |
        cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    # 3. Windows 실행에 필요한 Qt 필수 DLL 자동 수집 (windeployqt)
    - name: Deploy Windows Dependencies
      run: |
        # CMake 빌드 출력 디렉토리로 이동
        cd build\lmc
        windeployqt --release --no-compiler-runtime .

    # 4. Release 결과물 압축 파일 생성
    - name: Compress Release Artifact
      run: |
        powershell Compress-Archive -Path build\lmc\* -DestinationPath lan-messenger-windows-x64.zip

    # 5. GitHub Releases에 실행 파일 및 압축본 업로드
    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: lan-messenger-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
