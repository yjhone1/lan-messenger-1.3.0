name: Windows Release Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Qt 6.10.2 및 Ninja, MinGW 설정
    - name: Install Qt Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        install-deps: 'true'

    - name: Setup Ninja
      uses: meysamtaher/setup-ninja@v1

    # 2. CMake 빌드 (Ninja 제너레이터 사용)
    - name: Configure CMake
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

    - name: Build Project
      run: |
        cmake --build build --config Release

    # 3. Windows 의존성 파일(DLL) 수집
    - name: Deploy Windows Dependencies
      run: |
        Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -ExpandProperty DirectoryName | Set-Location
        windeployqt --release --no-compiler-runtime .

    # 4. 압축 파일 생성
    - name: Compress Release Artifact
      run: |
        $exeDir = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe").DirectoryName
        powershell Compress-Archive -Path "$exeDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\lan-messenger-windows-x64.zip"

    # 5. GitHub Releases에 업로드
    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: lan-messenger-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
