name: Windows Release Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Qt 6.10.2 및 MinGW 컴파일러 환경 설치
    - name: Install Qt Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        install-deps: 'true'

    # 2. MSYS2를 통해 MinGW 전용 OpenSSL 3.x 패키지 확보 및 CMake 연결
    - name: Configure CMake (MinGW OpenSSL)
      shell: powershell
      run: |
        # MSYS2 / MinGW 전용 OpenSSL 경로 설정
        $mingwSsl = "C:\msys64\mingw64"
        if (-not (Test-Path "$mingwSsl\include\openssl\evp.h")) {
          # 기본 MSYS2 mingw64 패키지 업데이트
          pacman -Sy --noconfirm mingw-w64-x86_64-openssl
        }

        Write-Host "Using MinGW OpenSSL Dir: $mingwSsl"

        cmake -B build -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DOPENSSL_ROOT_DIR="$mingwSsl" `
          -DOPENSSL_INCLUDE_DIR="$mingwSsl\include"

    # 3. 프로젝트 컴파일/빌드
    - name: Build Project
      run: |
        cmake --build build --config Release

    # 4. Windows 실행 필요 DLL 자동 수집
    - name: Deploy Windows Dependencies
      shell: powershell
      run: |
        $exePath = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1)
        if ($exePath) {
          Set-Location $exePath.DirectoryName
          windeployqt --release --no-compiler-runtime .
          
          # OpenSSL MinGW DLL 복사
          Get-ChildItem -Path "C:\msys64\mingw64\bin" -Filter "libcrypto*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination . -ErrorAction SilentlyContinue
          Get-ChildItem -Path "C:\msys64\mingw64\bin" -Filter "libssl*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination . -ErrorAction SilentlyContinue
        } else {
          Write-Error "lmc.exe not found in build directory"
        }

    # 5. Release 압축 파일 생성
    - name: Compress Release Artifact
      shell: powershell
      run: |
        $exeDir = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1).DirectoryName
        powershell Compress-Archive -Path "$exeDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\lan-messenger-windows-x64.zip"

    # 6. GitHub Release 업로드
    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: lan-messenger-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
