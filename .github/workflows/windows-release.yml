name: Windows Release Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Qt 6.10.2 및 MinGW 환경 설치
    - name: Install Qt Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        install-deps: 'true'

    # 2. 최신 OpenSSL 설치 (특정 버전 지정 삭제하여 404 차단)
    - name: Install OpenSSL
      run: |
        choco install openssl --no-progress -y --ignore-checksums || true

    # 3. CMake 구성 (OpenSSL 자동 경로 파악 및 빌드)
    - name: Configure CMake
      shell: powershell
      run: |
        # 윈도우 러너의 다양한 OpenSSL 위치 자동 파악
        $sslDirs = @(
          "C:\Program Files\OpenSSL-Win64",
          "C:\Program Files\OpenSSL",
          "C:\tools\php83",
          "C:\ProgramData\chocolatey\lib\openssl"
        )

        $sslDir = $null
        foreach ($dir in $sslDirs) {
          if (Test-Path "$dir\include\openssl\evp.h") {
            $sslDir = $dir
            break
          }
        }

        if (-not $sslDir) {
          # 기본 경로 할당
          $sslDir = "C:\Program Files\OpenSSL-Win64"
        }

        Write-Host "Found OpenSSL Root Dir: $sslDir"

        cmake -B build -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DOPENSSL_ROOT_DIR="$sslDir"

    # 4. 프로젝트 컴파일 및 빌드
    - name: Build Project
      run: |
        cmake --build build --config Release

    # 5. Windows 실행 필요 DLL 자동 수집 (OpenSSL DLL 포함)
    - name: Deploy Windows Dependencies
      shell: powershell
      run: |
        $exePath = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1)
        if ($exePath) {
          Set-Location $exePath.DirectoryName
          windeployqt --release --no-compiler-runtime .
          
          # OpenSSL DLL 복사
          $dlls = Get-ChildItem -Path "C:\Program Files", "C:\tools" -Recurse -Filter "libcrypto*.dll" -ErrorAction SilentlyContinue
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName . -ErrorAction SilentlyContinue
          }
        } else {
          Write-Error "lmc.exe not found in build directory"
        }

    # 6. Release 아티팩트 Zip 압축
    - name: Compress Release Artifact
      shell: powershell
      run: |
        $exeDir = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1).DirectoryName
        powershell Compress-Archive -Path "$exeDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\lan-messenger-windows-x64.zip"

    # 7. GitHub Release 업로드
    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: lan-messenger-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
