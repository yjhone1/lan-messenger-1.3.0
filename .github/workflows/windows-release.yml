name: Windows Release Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Qt 6.10.2 환경 설치
    - name: Install Qt Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        install-deps: 'true'

    # 2. Windows 러너에 OpenSSL 설치 (Chocolatey 활용)
    - name: Install OpenSSL
      run: |
        choco install openssl --no-progress -y

    # 3. CMake 구성 및 빌드 (OpenSSL 경로 명시)
    - name: Configure CMake
      run: |
        cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL-Win64"

    - name: Build Project
      run: |
        cmake --build build --config Release

    # 4. Windows 실행 필요 DLL 자동 수집 (OpenSSL DLL 포함)
    - name: Deploy Windows Dependencies
      run: |
        $exePath = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1)
        if ($exePath) {
          Set-Location $exePath.DirectoryName
          windeployqt --release --no-compiler-runtime .
          # OpenSSL DLL도 출력 디렉터리로 복사
          if (Test-Path "C:\Program Files\OpenSSL-Win64\bin\libssl-3-x64.dll") {
            Copy-Item "C:\Program Files\OpenSSL-Win64\bin\*.dll" . -ErrorAction SilentlyContinue
          }
        } else {
          Write-Error "lmc.exe not found in build directory"
        }

    # 5. 결과물 Zip 압축
    - name: Compress Release Artifact
      run: |
        $exeDir = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1).DirectoryName
        powershell Compress-Archive -Path "$exeDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\lan-messenger-windows-x64.zip"

    # 6. GitHub Release 업로드
    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: lan-messenger-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
