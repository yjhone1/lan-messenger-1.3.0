name: Windows Release Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Qt 6.10.2 및 MinGW 컴파일러 환경 설치
    - name: Install Qt Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        install-deps: 'true'

    # 2. CMake 구성 및 빌드 (기본 MinGW Makefiles 사용)
    - name: Configure CMake
      run: |
        cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: |
        cmake --build build --config Release

    # 3. Windows 실행 필요 DLL 자동 수집
    - name: Deploy Windows Dependencies
      run: |
        $exePath = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1)
        if ($exePath) {
          Set-Location $exePath.DirectoryName
          windeployqt --release --no-compiler-runtime .
        } else {
          Write-Error "lmc.exe not found in build directory"
        }

    # 4. 결과물 Zip 압축
    - name: Compress Release Artifact
      run: |
        $exeDir = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1).DirectoryName
        powershell Compress-Archive -Path "$exeDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\lan-messenger-windows-x64.zip"

    # 5. GitHub Release 업로드
    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: lan-messenger-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
