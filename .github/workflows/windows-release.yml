name: Windows Release Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. MSYS2 세팅 및 MSYS2 전용 Compiler, CMake, OpenSSL, Qt6 패키지 일괄 설치
    - name: Setup MSYS2 and Install Dependencies
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-multimedia
          mingw-w64-x86_64-qt6-tools

    # 2. MSYS2 Shell에서 CMake 빌드 수행 (MSYS2 Qt6 및 OpenSSL 자동 인식)
    - name: Configure and Build (MSYS2 Shell)
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    # 3. Windows 필요 DLL 자동 수집 (windeployqt 및 OpenSSL DLL)
    - name: Deploy Windows Dependencies
      shell: msys2 {0}
      run: |
        EXE_DIR=$(find build -name "lmc.exe" -exec dirname {} \;)
        if [ -n "$EXE_DIR" ]; then
          cd "$EXE_DIR"
          windeployqt --release --no-compiler-runtime .
          cp /mingw64/bin/libcrypto*.dll . 2>/dev/null || true
          cp /mingw64/bin/libssl*.dll . 2>/dev/null || true
        else
          echo "Error: lmc.exe not found" && exit 1
        fi

    # 4. Release 압축 파일 생성
    - name: Compress Release Artifact
      shell: powershell
      run: |
        $exeDir = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1).DirectoryName
        powershell Compress-Archive -Path "$exeDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\lan-messenger-windows-x64.zip"

    # 5. GitHub Release 업로드
    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: lan-messenger-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
