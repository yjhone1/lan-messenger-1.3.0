name: Windows Release Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Qt 6.10.2 및 MinGW 환경 설치
    - name: Install Qt Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        install-deps: 'true'

    # 2. OpenSSL 3.x 안정 버전 명시적 설치 (Chocolatey version 고정)
    - name: Install OpenSSL 3.x
      run: |
        choco install openssl --version=3.3.1 -y --no-progress --force

    # 3. CMake 구성 (OpenSSL 헤더/라이브러리 파일 직접 매핑)
    - name: Configure CMake
      shell: powershell
      run: |
        $sslDir = "C:\Program Files\OpenSSL-Win64"
        if (-not (Test-Path $sslDir)) { $sslDir = "C:\Program Files\OpenSSL" }

        Write-Host "Configuring CMake with OpenSSL at: $sslDir"

        # CMake가 라이브러리 파일(.lib / .a)을 100% 찾도록 직접 파일 경로 전달
        $cryptoLib = Get-ChildItem -Path "$sslDir\lib" -Recurse -Filter "*crypto*" | Select-Object -First 1
        $sslLib    = Get-ChildItem -Path "$sslDir\lib" -Recurse -Filter "*ssl*" | Select-Object -First 1

        cmake -B build -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DOPENSSL_ROOT_DIR="$sslDir" `
          -DOPENSSL_INCLUDE_DIR="$sslDir\include" `
          -DOPENSSL_CRYPTO_LIBRARY="$($cryptoLib.FullName)" `
          -DOPENSSL_SSL_LIBRARY="$($sslLib.FullName)"

    # 4. 프로젝트 빌드
    - name: Build Project
      run: |
        cmake --build build --config Release

    # 5. 실행 필요 DLL 배포 (Qt & OpenSSL DLL 복사)
    - name: Deploy Windows Dependencies
      shell: powershell
      run: |
        $exePath = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1)
        if ($exePath) {
          Set-Location $exePath.DirectoryName
          windeployqt --release --no-compiler-runtime .
          
          # OpenSSL 3.x 실행 DLL (libcrypto-3-x64.dll, libssl-3-x64.dll 등) 수집
          Get-ChildItem -Path "C:\Program Files\OpenSSL-Win64\bin", "C:\Program Files\OpenSSL\bin" -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination . -ErrorAction SilentlyContinue
        } else {
          Write-Error "lmc.exe not found in build directory"
        }

    # 6. Release 아티팩트 Zip 압축
    - name: Compress Release Artifact
      shell: powershell
      run: |
        $exeDir = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1).DirectoryName
        powershell Compress-Archive -Path "$exeDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\lan-messenger-windows-x64.zip"

    # 7. GitHub Release 업로드
    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: lan-messenger-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
