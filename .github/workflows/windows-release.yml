name: Windows Release Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Qt 6.10.2 및 MinGW 컴파일러 환경 설치
    - name: Install Qt Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        install-deps: 'true'

    # 2. CMake 구성 (Windows 러너 내장 OpenSSL / MinGW 경로 연결)
    - name: Configure CMake
      shell: powershell
      run: |
        # 윈도우 러너 기본 설치 OpenSSL / MinGW 경로 탐색
        $sslDir = "C:\Program Files\OpenSSL-Win64"
        if (-not (Test-Path "$sslDir\include\openssl\evp.h")) {
          $sslDir = "C:\Program Files\OpenSSL"
        }

        Write-Host "Using OpenSSL Directory: $sslDir"

        cmake -B build -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DOPENSSL_ROOT_DIR="$sslDir" `
          -DOPENSSL_INCLUDE_DIR="$sslDir\include"

    # 3. 프로젝트 컴파일/빌드
    - name: Build Project
      run: |
        cmake --build build --config Release

    # 4. Windows 실행 필요 DLL 자동 수집 (Qt & OpenSSL DLL)
    - name: Deploy Windows Dependencies
      shell: powershell
      run: |
        $exePath = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1)
        if ($exePath) {
          Set-Location $exePath.DirectoryName
          windeployqt --release --no-compiler-runtime .
          
          # OpenSSL DLL 복사
          Get-ChildItem -Path "C:\Program Files\OpenSSL-Win64\bin", "C:\Program Files\OpenSSL\bin" -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination . -ErrorAction SilentlyContinue
        } else {
          Write-Error "lmc.exe not found in build directory"
        }

    # 5. Release 압축 파일 생성
    - name: Compress Release Artifact
      shell: powershell
      run: |
        $exeDir = (Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1).DirectoryName
        powershell Compress-Archive -Path "$exeDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\lan-messenger-windows-x64.zip"

    # 6. GitHub Release 업로드
    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: lan-messenger-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
